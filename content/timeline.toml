# Timeline — Option A (structured rows with hover-reveal detail)
#
# Fields per entry:
#   category = "work" | "education"   -> controls colour + icon
#   title    = role or degree         -> the bold heading
#   org      = institution · place
#   period   = short date range shown on the left rail
#   chips    = ["skill", ...]         -> small tags under the heading (optional)
#   detail   = """..."""              -> reflection shown on hover / focus / tap (markdown, optional)
#
# Rows without a `detail` simply don't expand.
#
# Entries render in file order (no sorting in TimelineSection) — keep this list
# sorted by start date, most recent first.

